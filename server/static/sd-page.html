<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SD · Alice</title>
<link rel="preload" as="font" type="font/woff2" href="/static/fonts/montserrat-300-400.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/static/fonts/cormorant-garamond-300.woff2" crossorigin>
<link rel="stylesheet" href="/static/fonts/fonts.css?v=3">
<link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body>
<header>
  <h1>SD</h1>
  <div style="display:flex;gap:.6rem;align-items:center">
    <button class="cb" onclick="window.location='/'" title="Back to chat">← Back</button>
    <span id="sd-status" style="font-size:.7rem;color:var(--muted)">Loading…</span>
  </div>
</header>
<div class="main">
  <div class="cp">
    <div class="msgs" id="msgs">
      <div class="msg alice"><div class="sndr">Alice</div>Image generation console</div>
    </div>
    <div class="ir">
      <textarea id="sd-prompt" placeholder="Describe the image you want to generate…" rows="2"></textarea>
      <button id="sd-gen-btn" class="cb" onclick="generateSD()">Generate</button>
    </div>
  </div>
  <div class="ip">
    <div class="ih">
      <span id="ih">Static Diffusion</span>
    </div>
    <div class="ic-wrap">
      <div class="ic" id="ic"><div class="ph">Ready to generate.</div></div>
      <div class="is" id="is"></div>
    </div>
    <div id="sd-controls" style="display:flex;gap:.4rem;margin-top:.6rem;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:.3rem">
        <label style="font-size:.7rem;color:var(--muted)">Steps</label>
        <input type="number" id="sd-steps" value="25" min="1" max="100" style="width:50px">
      </div>
      <div style="display:flex;align-items:center;gap:.3rem">
        <label style="font-size:.7rem;color:var(--muted)">Width</label>
        <select id="sd-width" style="width:70px">
          <option>512</option><option>768</option><option>1024</option>
        </select>
      </div>
      <div style="display:flex;align-items:center;gap:.3rem">
        <label style="font-size:.7rem;color:var(--muted)">Height</label>
        <select id="sd-height" style="width:70px">
          <option>512</option><option>768</option><option>1024</option>
        </select>
      </div>
      <div style="display:flex;align-items:center;gap:.3rem">
        <label style="font-size:.7rem;color:var(--muted)">Seed</label>
        <input type="number" id="sd-seed" value="-1" style="width:60px" title="-1 = random">
      </div>
    </div>
    <div id="sd-progress" style="display:none;margin-top:.6rem">
      <div class="ph gen" id="sd-status-text">Generating…</div>
      <div class="img-progress-track"><div class="img-progress-fill" id="sd-progress-fill"></div></div>
    </div>
  </div>
</div>
<script src="/static/js/sd-page.js?v=1"></script>
</body>
</html>
